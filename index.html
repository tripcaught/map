<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>175m Equal Earth WebAR Map</title>
    
    <!-- Stable A-Frame Engine -->
    <script src="https://cloudflare.com"></script>
    
    <!-- Stable AR Engine -->
    <script src="https://githack.com"></script>

    <style>
      .ui-container {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        width: 100%;
        text-align: center;
        pointer-events: none;
      }
      .btn-realign {
        background-color: rgba(0, 122, 255, 0.9);
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 16px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: bold;
        border-radius: 30px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        cursor: pointer;
        pointer-events: auto;
      }
    </style>
  </head>
  
  <body style="margin: 0px; overflow: hidden;">

    <div class="ui-container">
      <button id="realignBtn" class="btn-realign">Realign the Map</button>
    </div>

    <!-- WebAR Camera Scene Config -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Safe asset container pointing to your local repository directory -->
      <a-assets>
        <img id="equalEarthMap" src="worldmap.svg">
      </a-assets>

      <!-- The Map Turntable Container -->
      
        <!-- 
          We use a fallback grid texture if 'worldmap.svg' isn't uploaded yet. 
          Once you upload your file named 'worldmap.svg', it will overwrite the grid.
        -->
        <a-plane 
          src="#equalEarthMap" 
          position="0 0 0" 
          rotation="-90 -26 0" 
          width="175" 
          height="85.37" 
          material="transparent: true; opacity: 0.6; shader: flat; side: double; color: #007aff;">
        </a-plane>
      

      <!-- Smartphone Tracking Camera -->
      
      
    </a-scene>

    <script>
      const button = document.getElementById('realignBtn');
      const turntable = document.getElementById('mapTurntable');
      const cameraEntity = document.getElementById('userCamera');

      button.addEventListener('click', () => {
        const cameraRotation = cameraEntity.object3D.rotation;
        const currentFacingDegrees = cameraRotation.y * (180 / Math.PI);
        const camPosition = cameraEntity.object3D.position;
        
        // Pin the map center right at your current feet position
        turntable.setAttribute('position', `${camPosition.x} 0 ${camPosition.z}`);
        // Pivot the map to align with the field angle based on your view direction
        turntable.setAttribute('rotation', `0 ${currentFacingDegrees} 0`);
      });
    </script>
  </body>
</html>
