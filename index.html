<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>AR.js Floor Map</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    /*
      AR.js inserts this video element dynamically.
      It must be behind the transparent A-Frame canvas.
    */
    #arjs-video,
    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;

      width: 100% !important;
      height: 100% !important;

      z-index: 0 !important;
      background: #000;

      /*
        contain shows the whole camera image.
        Change to cover if you prefer the camera to fill
        the entire screen, at the cost of some cropping.
      */
      object-fit: contain !important;
    }

    /*
      Keep the A-Frame rendering layer above the camera.
    */
    .a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;

      width: 100% !important;
      height: 100% !important;

      z-index: 1 !important;
      background: transparent !important;
    }

    #instructions {
      position: fixed;
      z-index: 10;

      top: 15px;
      left: 50%;
      transform: translateX(-50%);

      width: max-content;
      max-width: 90%;
      box-sizing: border-box;

      padding: 10px 14px;
      border-radius: 8px;

      color: white;
      background: rgba(0, 0, 0, 0.75);

      font-family: sans-serif;
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }

    #status {
      margin-top: 5px;
      color: #bde7ff;
    }

    #zoomControls {
      position: fixed;
      z-index: 10;

      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);

      display: flex;
      gap: 8px;
    }

    #zoomControls button {
      padding: 10px 15px;
      border: 0;
      border-radius: 7px;

      color: white;
      background: rgba(0, 0, 0, 0.75);

      font-size: 15px;
    }
  </style>
</head>

<body>
  <div id="instructions">
    Point the camera at the Hiro marker.

    <div id="status">
      Starting camera...
    </div>
  </div>

  <div id="zoomControls">
    <button id="smallerButton" type="button">
      Map −
    </button>

    <button id="largerButton" type="button">
      Map +
    </button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
      precision: medium;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: false;
    "
  >
    <a-marker
      id="mapMarker"
      preset="hiro"

      smooth="true"
      smooth-count="10"
      smooth-tolerance="0.01"
      smooth-threshold="5"
    >
      <a-plane
        id="mapPlane"
        src="./worldmap.svg"

        position="0 0.01 0"
        rotation="-90 -26 0"

        width="3"
        height="3"

        material="
          shader: flat;
          transparent: true;
          opacity: 0.75;
          side: double;
        "
      >
      </a-plane>

      <a-ring
        position="0 0.015 0"
        rotation="-90 0 0"

        radius-inner="0.12"
        radius-outer="0.15"

        color="#00ff00"

        material="
          shader: flat;
          opacity: 0.8;
        "
      >
      </a-ring>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.getElementById("mapMarker");
    const mapPlane = document.getElementById("mapPlane");
    const status = document.getElementById("status");

    const smallerButton =
      document.getElementById("smallerButton");

    const largerButton =
      document.getElementById("largerButton");

    let mapSize = 3;

    /*
      AR.js creates the camera video after the A-Frame scene
      has initialized.
    */
    function waitForCameraVideo() {
      const video =
        document.querySelector("#arjs-video") ||
        document.querySelector("video");

      if (!video) {
        status.textContent =
          "Waiting for camera...";

        setTimeout(waitForCameraVideo, 500);
        return;
      }

      video.setAttribute("autoplay", "");
      video.setAttribute("playsinline", "");
      video.setAttribute("muted", "");

      video.style.position = "fixed";
      video.style.top = "0";
      video.style.left = "0";
      video.style.width = "100%";
      video.style.height = "100%";
      video.style.objectFit = "contain";
      video.style.zIndex = "0";

      video.addEventListener("loadedmetadata", () => {
        status.textContent =
          "Camera active. Point it at the Hiro marker.";

        setMinimumCameraZoom(video);
      });

      video.addEventListener("playing", () => {
        status.textContent =
          "Camera active. Point it at the Hiro marker.";

        setMinimumCameraZoom(video);
      });

      /*
        Some browsers already started the video before
        the event listeners were attached.
      */
      if (!video.paused && video.readyState >= 2) {
        status.textContent =
          "Camera active. Point it at the Hiro marker.";

        setMinimumCameraZoom(video);
      }
    }

    async function setMinimumCameraZoom(video) {
      if (!video.srcObject) {
        return;
      }

      const tracks =
        video.srcObject.getVideoTracks();

      if (!tracks.length) {
        return;
      }

      const track = tracks[0];

      if (!track.getCapabilities) {
        return;
      }

      const capabilities =
        track.getCapabilities();

      if (
        capabilities.zoom &&
        typeof capabilities.zoom.min === "number"
      ) {
        try {
          await track.applyConstraints({
            advanced: [
              {
                zoom: capabilities.zoom.min
              }
            ]
          });

          console.log(
            "Camera zoom set to minimum:",
            capabilities.zoom.min
          );
        } catch (error) {
          console.warn(
            "Camera zoom could not be changed:",
            error
          );
        }
      }
    }

    marker.addEventListener("markerFound", () => {
      status.textContent =
        "Marker found. Map is active.";

      status.style.color = "#8cff8c";
    });

    marker.addEventListener("markerLost", () => {
      status.textContent =
        "Marker lost. Point the camera at it.";

      status.style.color = "#ffcc80";
    });

    smallerButton.addEventListener("click", () => {
      mapSize = Math.max(0.5, mapSize - 0.5);

      mapPlane.setAttribute("width", mapSize);
      mapPlane.setAttribute("height", mapSize);
    });

    largerButton.addEventListener("click", () => {
      mapSize += 0.5;

      mapPlane.setAttribute("width", mapSize);
      mapPlane.setAttribute("height", mapSize);
    });

    /*
      Begin looking for the AR.js-created video element
      after the page loads.
    */
    window.addEventListener("load", () => {
      setTimeout(waitForCameraVideo, 1000);
    });
  </script>
</body>
</html>
