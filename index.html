<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             user-scalable=no,
             minimum-scale=1.0,
             maximum-scale=1.0">

  <title>175m Equal Earth WebAR Map</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    /*
      AR.js creates a video element for the camera.
      Force it to fill the screen.
    */
    #arjs-video,
    body > video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      z-index: 0 !important;
    }

    /*
      Keep the A-Frame canvas above the camera video,
      while retaining transparency so the video remains visible.
    */
    .a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    #permissionShield {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      color: #fff;
      text-align: center;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, sans-serif;
    }

    #permissionShield h2 {
      margin-bottom: 10px;
    }

    #permissionShield p {
      max-width: 320px;
      margin: 0 20px 25px;
      color: #aaa;
    }

    .btn-start,
    .btn-realign {
      border: 0;
      border-radius: 30px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-start {
      padding: 20px 40px;
      background: #28a745;
    }

    .btn-start:active,
    .btn-realign:active {
      transform: scale(0.96);
    }

    #uiLayer {
      position: fixed;
      bottom: 30px;
      left: 50%;
      z-index: 9999;

      display: none;
      transform: translateX(-50%);
    }

    .btn-realign {
      padding: 15px 30px;
      background: rgba(0, 122, 255, 0.9);
    }

    #debugMessage {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10000;

      display: none;
      padding: 8px 10px;
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      font: 12px monospace;
    }
  </style>
</head>

<body>
  <div id="permissionShield">
    <h2>175m AR Field Map</h2>

    <p>
      Tap below to launch your camera overlay.
    </p>

    <button id="startBtn" class="btn-start">
      Start AR Experience
    </button>
  </div>

  <div id="uiLayer">
    <button id="realignBtn" class="btn-realign">
      Realign the Map
    </button>
  </div>

  <div id="debugMessage"></div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="
      alpha: true;
      antialias: true;
      clearColor: #00000000;
    "
    arjs="
      sourceType: webcam;
      debugUIEnabled: false;
      sourceWidth: 1280;
      sourceHeight: 720;
      displayWidth: 1280;
      displayHeight: 720;
    ">

    <a-assets>
      <img
        id="equalEarthMap"
        src="./worldmap.svg"
        crossorigin="anonymous">
    </a-assets>

    <!-- Diagnostic object -->
    <a-box
      id="testCube"
      position="0 0 -3"
      rotation="0 45 0"
      width="0.5"
      height="0.5"
      depth="0.5"
      color="#ff0000">
    </a-box>

    <!-- Map initially placed in front of the camera -->
    <a-entity
      id="mapTurntable"
      position="0 0 -3"
      rotation="0 0 0">

      <a-plane
        id="mapPlane"
        src="#equalEarthMap"
        position="0 0 0"
        rotation="-90 0 0"
        width="4"
        height="1.95"
        material="
          shader: flat;
          transparent: true;
          opacity: 0.9;
          side: double;
        ">
      </a-plane>

    </a-entity>

    <a-camera
      id="userCamera"
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

  </a-scene>

  <script>
    const startBtn =
      document.getElementById('startBtn');

    const permissionShield =
      document.getElementById('permissionShield');

    const uiLayer =
      document.getElementById('uiLayer');

    const realignBtn =
      document.getElementById('realignBtn');

    const turntable =
      document.getElementById('mapTurntable');

    const cameraEntity =
      document.getElementById('userCamera');

    const debugMessage =
      document.getElementById('debugMessage');

    const scene =
      document.querySelector('a-scene');

    function showDebugMessage(message) {
      debugMessage.textContent = message;
      debugMessage.style.display = 'block';
      console.log(message);
    }

    /*
      Request permissions after the user taps the button.
      AR.js itself starts the webcam session.
    */
    startBtn.addEventListener('click', async () => {
      permissionShield.style.display = 'none';
      uiLayer.style.display = 'block';

      showDebugMessage('Starting AR experience...');

      /*
        Required by iOS Safari for motion sensors.
      */
      if (
        typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'
      ) {
        try {
          const response =
            await DeviceOrientationEvent.requestPermission();

          console.log(
            'Motion permission response:',
            response
          );
        } catch (error) {
          console.error(
            'Motion permission error:',
            error
          );
        }
      }

      /*
        Give AR.js time to create its video element,
        then force the video to play.
      */
      setTimeout(startCameraVideo, 1500);
    });

    function startCameraVideo() {
      const video =
        document.getElementById('arjs-video') ||
        document.querySelector('video');

      if (!video) {
        showDebugMessage(
          'Camera video element was not found.'
        );

        console.error(
          'AR.js did not create a video element.'
        );

        return;
      }

      video.setAttribute('autoplay', '');
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');
      video.muted = true;

      video.style.display = 'block';
      video.style.visibility = 'visible';
      video.style.opacity = '1';

      video.play()
        .then(() => {
          showDebugMessage('Camera video is playing.');
        })
        .catch(error => {
          showDebugMessage(
            'Camera video could not play.'
          );

          console.error(
            'Camera video playback error:',
            error
          );
        });

      console.log('Camera video element:', video);
    }

    /*
      Confirm that A-Frame has loaded.
    */
    scene.addEventListener('loaded', () => {
      console.log('A-Frame scene loaded.');
      console.log('Camera entity:', cameraEntity);
      console.log('AR.js component:', scene.components.arjs);
    });

    /*
      Realign the map relative to the current camera position.
    */
    realignBtn.addEventListener('click', () => {
      if (!cameraEntity || !turntable) {
        console.error(
          'The camera or map entity is missing.'
        );

        return;
      }

      const cameraObject =
        cameraEntity.object3D;

      const mapObject =
        turntable.object3D;

      const cameraPosition =
        cameraObject.getWorldPosition(
          new THREE.Vector3()
        );

      /*
        Keep the map slightly below and in front
        of the camera.
      */
      mapObject.position.set(
        cameraPosition.x,
        cameraPosition.y - 1.5,
        cameraPosition.z - 3
      );

      mapObject.rotation.set(
        0,
        cameraObject.rotation.y,
        0
      );

      console.log('Map realigned.');
    });

    /*
      Report JavaScript errors visibly and in the console.
    */
    window.addEventListener('error', event => {
      console.error(
        'Page error:',
        event.message
      );

      showDebugMessage(
        'Error: ' + event.message
      );
    });
  </script>
</body>
</html>
