<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>AR.js Floor Map</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- AR.js marker tracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #instructions {
      position: fixed;
      z-index: 20;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);

      width: max-content;
      max-width: 90%;
      box-sizing: border-box;

      padding: 10px 14px;
      border-radius: 8px;

      color: white;
      background: rgba(0, 0, 0, 0.7);

      font-family: sans-serif;
      font-size: 14px;
      text-align: center;
    }

    #status {
      margin-top: 5px;
      color: #bde7ff;
    }
  </style>
</head>

<body>
  <div id="instructions">
    Point the camera at the Hiro marker.
    <div id="status">
      Waiting for marker...
    </div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="
      antialias: true;
      alpha: true;
      precision: medium;
    "
    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: false;
    "
  >
    <!--
      The Hiro marker is the physical reference point.

      Change preset="hiro" to
      type="pattern"
      url="./my-marker.patt"
      if you create a custom marker.
    -->
    <a-marker
      id="mapMarker"
      preset="hiro"
      smooth="true"
      smooth-count="10"
      smooth-tolerance="0.01"
      smooth-threshold="5"
    >
      <!--
        The map is three times larger than the original version.

        markerWidth is 1 AR unit, so this map is approximately
        3 x 3 marker widths.

        Position y="0.01" places it just above the marker plane.
      -->
      <a-plane
        id="mapPlane"
        src="./worldmap.svg"
        position="0 0.01 0"
        rotation="-90 -26 0"
        width="3"
        height="3"
        material="
          shader: flat;
          transparent: true;
          opacity: 0.75;
          side: double;
        "
      >
      </a-plane>

      <!-- Optional small marker indicator -->
      <a-ring
        position="0 0.015 0"
        rotation="-90 0 0"
        radius-inner="0.12"
        radius-outer="0.15"
        color="#00ff00"
        material="shader: flat; opacity: 0.8;"
      >
      </a-ring>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.getElementById("mapMarker");
    const status = document.getElementById("status");

    marker.addEventListener("markerFound", () => {
      status.textContent = "Marker found. Map is active.";
      status.style.color = "#8cff8c";
    });

    marker.addEventListener("markerLost", () => {
      status.textContent = "Marker lost. Point the camera at it.";
      status.style.color = "#ffcc80";
    });
  </script>
</body>
</html>
