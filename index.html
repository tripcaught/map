<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Camera Map Overlay</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #map {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 90vmin;
      height: 90vmin;
      transform: translate(-50%, -50%);
      opacity: 0.55;
      z-index: 2;
      pointer-events: none;
    }

    #controls {
      position: fixed;
      z-index: 3;
      left: 0;
      right: 0;
      bottom: 25px;
      text-align: center;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <video id="camera" autoplay playsinline></video>

  <img
    id="map"
    src="./worldmap.svg"
    alt="Map overlay"
  >

  <div id="controls">
    <button id="startButton">
      Start Camera
    </button>
  </div>

  <script>
    const camera = document.getElementById("camera");
    const map = document.getElementById("map");
    const startButton = document.getElementById("startButton");

    let heading = 0;
    let pitch = 0;
    let roll = 0;

    startButton.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });

        camera.srcObject = stream;

        /*
          iPhones require permission to access motion/orientation data.
        */
        if (
          typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function"
        ) {
          const permission =
            await DeviceOrientationEvent.requestPermission();

          if (permission !== "granted") {
            alert("Motion permission was not granted.");
            return;
          }
        }

        window.addEventListener(
          "deviceorientation",
          handleOrientation,
          true
        );

        startButton.style.display = "none";
      } catch (error) {
        console.error(error);
        alert(
          "Camera access failed. Make sure the page is served over HTTPS."
        );
      }
    });

    function handleOrientation(event) {
      heading = event.alpha || 0;
      pitch = event.beta || 0;
      roll = event.gamma || 0;

      /*
        This is only a visual approximation. It does not create
        true world-locked AR.
      */
      map.style.transform = `
        translate(-50%, -50%)
        rotate(${-heading}deg)
        perspective(500px)
        rotateX(${pitch - 45}deg)
        rotateZ(${roll}deg)
      `;
    }
  </script>
</body>
</html>
