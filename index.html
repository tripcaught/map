<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <title>175m Equal Earth WebXR Map</title>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    #startButton {
      position: fixed;
      z-index: 20;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      padding: 18px 28px;
      border: 0;
      border-radius: 30px;

      color: white;
      background: #28a745;
      font-size: 18px;
      font-weight: bold;
    }

    #message {
      position: fixed;
      z-index: 20;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);

      display: none;
      width: calc(100% - 40px);
      max-width: 500px;
      padding: 10px;

      color: white;
      background: rgba(0, 0, 0, 0.7);
      text-align: center;
      box-sizing: border-box;
    }

    #placeButton {
      position: fixed;
      z-index: 20;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);

      display: none;
      padding: 15px 28px;
      border: 0;
      border-radius: 30px;

      color: white;
      background: rgba(0, 122, 255, 0.95);
      font-size: 17px;
      font-weight: bold;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
    }
  </style>
</head>

<body>
  <button id="startButton">
    Start AR Experience
  </button>

  <div id="message"></div>

  <button id="placeButton">
    Place Map Here
  </button>

  <script>
    const startButton =
      document.getElementById('startButton');

    const placeButton =
      document.getElementById('placeButton');

    const messageElement =
      document.getElementById('message');

    let renderer;
    let scene;
    let camera;

    let xrSession = null;
    let referenceSpace = null;
    let viewerSpace = null;
    let hitTestSource = null;

    let reticle;
    let mapMesh;
    let mapPlaced = false;
    let latestHitPose = null;

    const MAP_WIDTH_METERS = 175;
    const MAP_HEIGHT_METERS = 85.37;

    /*
      The requested vertical offset.

      A floor placement normally uses the hit-test floor position.
      This offset moves the map 0.75 meters below that detected
      surface. Set this to 0 if the map should sit on the floor.
    */
    const MAP_VERTICAL_OFFSET = -0.75;

    function showMessage(text) {
      messageElement.textContent = text;
      messageElement.style.display = 'block';
    }

    function hideMessage() {
      messageElement.style.display = 'none';
    }

    async function checkWebXRSupport() {
      if (!navigator.xr) {
        showMessage(
          'WebXR AR is not available in this browser.'
        );

        return false;
      }

      const supported =
        await navigator.xr.isSessionSupported(
          'immersive-ar'
        );

      if (!supported) {
        showMessage(
          'This device or browser does not support immersive AR.'
        );

        return false;
      }

      return true;
    }

async function startAR() {
  const supported =
    await checkWebXRSupport();

  if (!supported) {
    return;
  }

  try {
    xrSession =
      await navigator.xr.requestSession(
        'immersive-ar',
        {
          requiredFeatures: [
            'hit-test',
            'dom-overlay'
          ],
          domOverlay: {
            root: document.body
          }
        }
      );

    xrSession.addEventListener(
      'end',
      onSessionEnded
    );

setupThreeJS();

await renderer.xr.setSession(xrSession);

referenceSpace =
  await xrSession.requestReferenceSpace('local');

viewerSpace =
  await xrSession.requestReferenceSpace('viewer');

hitTestSource =
  await xrSession.requestHitTestSource({
    space: viewerSpace
  });

renderer.setAnimationLoop(renderXRFrame);

  } catch (error) {
    console.error(
      'Could not start WebXR AR:',
      error
    );

    showMessage(
      'Could not start AR: ' + error.message
    );
  }
}
    function setupThreeJS() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
      );

      renderer =
        new THREE.WebGLRenderer({
          alpha: true,
          antialias: true
        });

      renderer.setPixelRatio(
        window.devicePixelRatio
      );

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.xr.enabled = true;

      document.body.appendChild(
        renderer.domElement
      );

      /*
        Green reticle showing the detected floor position.
      */
      const reticleGeometry =
        new THREE.RingGeometry(
          0.08,
          0.12,
          32
        );

      const reticleMaterial =
        new THREE.MeshBasicMaterial({
          color: 0x00ff00,
          side: THREE.DoubleSide
        });

      reticle = new THREE.Mesh(
        reticleGeometry,
        reticleMaterial
      );

      reticle.rotation.x = -Math.PI / 2;
      reticle.visible = false;

      scene.add(reticle);

      window.addEventListener(
        'resize',
        onWindowResize
      );
    }

    function createMap() {
      const textureLoader =
        new THREE.TextureLoader();

      textureLoader.load(
        './worldmap.svg',
        texture => {
          texture.colorSpace =
            THREE.SRGBColorSpace;

          const mapGeometry =
            new THREE.PlaneGeometry(
              MAP_WIDTH_METERS,
              MAP_HEIGHT_METERS
            );

          const mapMaterial =
            new THREE.MeshBasicMaterial({
              map: texture,
              transparent: true,
              opacity: 0.7,
              side: THREE.DoubleSide
            });

          mapMesh = new THREE.Mesh(
            mapGeometry,
            mapMaterial
          );

          /*
            Make the map horizontal.
          */
          mapMesh.rotation.x = -Math.PI / 2;

          mapMesh.visible = false;

          scene.add(mapMesh);

          console.log(
            'worldmap.svg loaded successfully.'
          );
        },
        undefined,
        error => {
          console.error(
            'Could not load worldmap.svg:',
            error
          );

          showMessage(
            'Could not load worldmap.svg'
          );
        }
      );
    }

function renderXRFrame(time, frame) {
  const session = frame.session;

  const pose =
    frame.getViewerPose(referenceSpace);

  if (!pose) {
    return;
  }

  if (hitTestSource && !mapPlaced) {
    const hitTestResults =
      frame.getHitTestResults(
        hitTestSource
      );

    if (hitTestResults.length > 0) {
      const hit =
        hitTestResults[0];

      const hitPose =
        hit.getPose(referenceSpace);

      if (hitPose) {
        latestHitPose = hitPose;

        const position =
          hitPose.transform.position;

        const orientation =
          hitPose.transform.orientation;

        reticle.visible = true;

        reticle.position.set(
          position.x,
          position.y,
          position.z
        );

        reticle.quaternion.set(
          orientation.x,
          orientation.y,
          orientation.z,
          orientation.w
        );

        showMessage(
          'Surface detected. Tap Place Map Here.'
        );
      }
    } else {
      reticle.visible = false;

      showMessage(
        'Move the phone slowly to scan for a floor or table.'
      );
    }
  }

  renderer.render(
    scene,
    camera
  );


    function placeMap() {
      if (!latestHitPose || !mapMesh) {
        showMessage(
          'Wait until the floor reticle appears.'
        );

        return;
      }

      const position =
        latestHitPose.transform.position;

      const orientation =
        latestHitPose.transform.orientation;

      mapMesh.position.set(
        position.x,
        position.y + MAP_VERTICAL_OFFSET,
        position.z
      );

      /*
        Use the detected floor orientation.
        This keeps the map horizontal relative
        to the detected real-world surface.
      */
      mapMesh.quaternion.set(
        orientation.x,
        orientation.y,
        orientation.z,
        orientation.w
      );

      /*
        PlaneGeometry is vertical by default.
        Rotate it horizontally after applying
        the floor orientation.
      */
      mapMesh.rotateX(-Math.PI / 2);

      mapMesh.visible = true;
      mapPlaced = true;
      reticle.visible = false;
      placeButton.style.display = 'none';

      showMessage(
        'Map placed. Walk around it to inspect the 175m map.'
      );
    }

    function onSessionEnded() {
      xrSession = null;
      hitTestSource = null;
      referenceSpace = null;
      viewerSpace = null;

      if (renderer) {
        renderer.xr.enabled = false;
        renderer.domElement.remove();
      }

      startButton.style.display = 'block';
      placeButton.style.display = 'none';
      hideMessage();
    }

    function onWindowResize() {
      if (!camera || !renderer) {
        return;
      }

      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    }

    startButton.addEventListener(
      'click',
      startAR
    );

    placeButton.addEventListener(
      'click',
      placeMap
    );

    createMap();
  </script>
</body>
</html>
