<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 user-scalable=no">

  <title>175m Equal Earth WebAR Map</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    #permissionShield {
      position: fixed;
      inset: 0;
      background: #111;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    .btn-start,
    .btn-realign {
      border: 0;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }

    .btn-start {
      background: #28a745;
      padding: 20px 40px;
    }

    .ui-container {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: none;
    }

    .btn-realign {
      background: rgba(0, 122, 255, 0.9);
      padding: 15px 30px;
    }
  </style>
</head>

<body>
  <div id="permissionShield">
    <h2>175m AR Field Map</h2>
    <p>Tap below to launch the camera overlay.</p>
    <button id="startBtn" class="btn-start">
      Start AR Experience
    </button>
  </div>

  <div id="uiLayer" class="ui-container">
    <button id="realignBtn" class="btn-realign">
      Realign the Map
    </button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="
      sourceType: webcam;
      debugUIEnabled: false;
      sourceWidth: 1280;
      sourceHeight: 720;
      displayWidth: 1280;
      displayHeight: 720;
    ">

    <a-assets>
      <img
        id="equalEarthMap"
        src="./worldmap.svg"
        crossorigin="anonymous">
    </a-assets>

    <!-- This entity is now available to the script -->
    <a-entity id="mapTurntable" position="0 0 0">

    <a-plane
    id="mapPlane"
    position="0 0 0"
    rotation="-90 0 0"
    width="4"
    height="1.95"
    material="
      shader: flat;
      color: lime;
      side: double;
      transparent: true;
      opacity: 0.9;
    ">
  </a-plane>

    </a-entity>

    <!-- This entity is now available to the script -->
    <a-entity
      id="userCamera"
      camera
      look-controls="enabled: false">
    </a-entity>

  </a-scene>

  <script>
    const startBtn = document.getElementById('startBtn');
    const permissionShield =
      document.getElementById('permissionShield');
    const uiLayer = document.getElementById('uiLayer');
    const realignBtn = document.getElementById('realignBtn');
    const turntable = document.getElementById('mapTurntable');
    const cameraEntity = document.getElementById('userCamera');

    startBtn.addEventListener('click', async () => {
      permissionShield.style.display = 'none';
      uiLayer.style.display = 'block';

      // Required by iOS Safari for motion sensors.
      if (
        typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'
      ) {
        try {
          const result =
            await DeviceOrientationEvent.requestPermission();

          if (result !== 'granted') {
            console.warn('Motion permission was not granted.');
          }
        } catch (error) {
          console.error(
            'Could not request motion permission:',
            error
          );
        }
      }

      // Start AR.js after the user gesture.
      const scene = document.querySelector('a-scene');

      if (scene.hasLoaded) {
        startCamera();
      } else {
        scene.addEventListener('loaded', startCamera, { once: true });
      }
    });

    function startCamera() {
      const scene = document.querySelector('a-scene');

      if (
        scene.components &&
        scene.components.arjs &&
        scene.components.arjs.arSession
      ) {
        scene.components.arjs.arSession.resume();
      }
    }

    realignBtn.addEventListener('click', () => {
      const cameraObject = cameraEntity.object3D;
      const mapObject = turntable.object3D;

      const cameraPosition = cameraObject.position;
      const cameraRotation = cameraObject.rotation;

      // Place the map at the user's current horizontal location.
      mapObject.position.set(
        cameraPosition.x,
        0,
        cameraPosition.z
      );

      // Use the camera's horizontal heading.
      const headingDegrees =
        THREE.MathUtils.radToDeg(cameraRotation.y);

      mapObject.rotation.set(
        0,
        THREE.MathUtils.degToRad(headingDegrees),
        0
      );
    });
  </script>
</body>
</html>
