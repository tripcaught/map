<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>175m Equal Earth WebAR Map</title>
    
    <!-- Stable A-Frame Engine (v1.4.0) -->
    <script src="https://cloudflare.com"></script>
    
    <!-- Stable AR.js Engine -->
    <script src="https://githack.com"></script>

    <style>
      /* Fullscreen permission shield required by modern mobile browsers */
      #permissionShield {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: #111;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .btn-start {
        background-color: #28a745;
        color: white; border: none; padding: 20px 40px;
        font-size: 18px; font-weight: bold; border-radius: 30px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer;
      }
      /* Control overlay for field alignment */
      .ui-container {
        position: fixed; bottom: 30px; left: 50%;
        transform: translateX(-50%); z-index: 9999;
        width: 100%; text-align: center; pointer-events: none;
        display: none; /* Hidden until camera starts */
      }
      .btn-realign {
        background-color: rgba(0, 122, 255, 0.9);
        color: white; border: none; padding: 15px 30px;
        font-size: 16px; font-weight: bold; border-radius: 30px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer;
        pointer-events: auto;
      }
    </style>
  </head>
  
  <body style="margin: 0px; overflow: hidden;">

    <!-- Initial Landing Screen to force user-gesture permission approval -->
    <div id="permissionShield">
      <h2 style="margin-bottom: 20px;">175m AR Field Map</h2>
      <button id="startBtn" class="btn-start">Start AR Experience</button>
      <p style="margin-top: 15px; font-size: 13px; color: #aaa;">Please allow camera & motion access when prompted.</p>
    </div>

    <!-- Alignment Interface Layer -->
    <div id="uiLayer" class="ui-container">
      <button id="realignBtn" class="btn-realign">Realign the Map</button>
    </div>

    <!-- WebAR Scene Setup -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
      vr-mode-ui="enabled: false">
      
      <a-assets>
        <img id="equalEarthMap" src="worldmap.svg">
      </a-assets>

      
        <a-plane 
          src="#equalEarthMap" 
          position="0 0 0" 
          rotation="-90 -26 0" 
          width="175" 
          height="85.37" 
          material="transparent: true; opacity: 0.7; shader: flat; side: double;">
        </a-plane>
      

      
    </a-scene>

    <script>
      const startBtn = document.getElementById('startBtn');
      const permissionShield = document.getElementById('permissionShield');
      const uiLayer = document.getElementById('uiLayer');
      const realignBtn = document.getElementById('realignBtn');
      const turntable = document.getElementById('mapTurntable');
      const cameraEntity = document.getElementById('userCamera');

      // 1. Handle starting the AR environment via direct interaction
      startBtn.addEventListener('click', () => {
        // Remove the black landing screen overlay
        permissionShield.style.display = 'none';
        uiLayer.style.display = 'block';

        // Explicitly request DeviceOrientation tokens for iOS 13+ devices
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(response => {
              if (response == 'granted') {
                window.location.reload(); // Reload once to register sensors if needed
              }
            })
            .catch(console.error);
        }
      });

      // 2. Realignment control logic
      realignBtn.addEventListener('click', () => {
        const cameraRotation = cameraEntity.object3D.rotation;
        const currentFacingDegrees = cameraRotation.y * (180 / Math.PI);
        const camPosition = cameraEntity.object3D.position;
        
        turntable.setAttribute('position', `${camPosition.x} 0 ${camPosition.z}`);
        turntable.setAttribute('rotation', `0 ${currentFacingDegrees} 0`);
      });
    </script>
  </body>
</html>
